name: Frontend CI
 
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
 
jobs:
  frontend-test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Speeds up installs by caching node_modules
 
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
 
      - name: Run tests
        working-directory: frontend
        run: npm test
 
      - name: Lint code
        working-directory: frontend
        run: npm run lint || npx eslint
